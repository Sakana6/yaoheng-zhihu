  description: '基于冻结清单 v1 整理的业务后端契约。 路径中的 `{patientId}`、`{medId}`、`{sessionId}`、`{reportId}` 是 OpenAPI 标准写法， 对应冻结文档中的 `:id`
    风格路径。

    '
servers:
