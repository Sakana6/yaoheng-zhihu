      - medicationMasterId
      - dose
      - frequency
      - administrationTime
      - startDate
      - status
      properties:
        medicationMasterId:
          type: integer
        dose:
          type: string
        frequency:
          type: string
        administrationTime:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        status:
          type: string
        confirmedByUser:
          type: boolean
    PatientMedication:
      type: object
      properties:
        id:
          type: integer
        medicationMasterId:
          type: integer
        genericName:
          type: string
        brandName:
          type: string
          nullable: true
        dose:
          type: string
        frequency:
          type: string
        administrationTime:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        status:
          type: string
        confirmedByUser:
          type: boolean
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        standardizationStatus:
          type: string
