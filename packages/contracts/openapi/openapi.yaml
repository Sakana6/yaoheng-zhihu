components:
  parameters:
    PatientId:
      name: patientId
      in: path
      required: true
      schema:
        type: integer
    MedicationId:
      name: medId
      in: path
      required: true
      schema:
        type: integer
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
  schemas:
    SyncEnvelope:
      type: object
      required:
      - code
      - message
      - data
      - requestId
      - timestamp
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          type: object
        requestId:
          type: string
          example: req_xxx
        timestamp:
          type: string
          format: date-time
    AsyncEnvelope:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: accepted
        data:
          type: object
    BasicSuccessEnvelope:
      allOf:
      - $ref: '#/components/schemas/SyncEnvelope'
      - type: object
        properties:
          data:
            type: object
            properties:
              success:
                type: boolean
                example: true
    AcceptedTask:
      type: object
      required:
      - taskId
      - status
      properties:
        taskId:
          type: string
        status:
          $ref: '#/components/schemas/AsyncStatus'
    AsyncStatus:
      type: string
      enum:
      - PENDING
      - RUNNING
      - SUCCESS
      - FAILED
    ReviewPriority:
      type: string
      enum:
      - OBSERVE
      - RETEST_SOON
      - CLINIC_REVIEW
      - HIGH_PRIORITY
    RiskDirection:
      type: string
      enum:
      - DEINTENSIFICATION
      - INTERACTION
      - TEMPORAL_BEHAVIOR
      - JOINT_EVENT
    LoginRequest:
      type: object
      required:
      - mobile
      - verifyCode
      properties:
        mobile:
          type: string
        verifyCode:
          type: string
    LoginData:
      type: object
      properties:
        token:
          type: string
        userId:
          type: integer
        role:
          type: string
        patientId:
          type: integer
          nullable: true
    CurrentPatientContext:
      type: object
      properties:
        userId:
          type: integer
        role:
          type: string
        patientId:
          type: integer
          nullable: true
        patientName:
          type: string
          nullable: true
    PatientProfile:
      type: object
      required:
      - id
      - name
      - gender
      - birthday
      - livingStatus
      - digitalAbilityLevel
      properties:
        id:
          type: integer
        name:
          type: string
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - OTHER
        birthday:
          type: string
          format: date
        livingStatus:
          type: string
        digitalAbilityLevel:
          type: string
        diseaseTags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    PatientCreateRequest:
      type: object
      required:
      - name
      - gender
      - birthday
      - livingStatus
      - digitalAbilityLevel
      properties:
        name:
          type: string
        gender:
          type: string
        birthday:
          type: string
          format: date
        livingStatus:
          type: string
        digitalAbilityLevel:
          type: string
        diseaseTags:
          type: array
          items:
            type: string
    PatientPatchRequest:
      type: object
      properties:
        name:
          type: string
        livingStatus:
          type: string
        digitalAbilityLevel:
          type: string
        diseaseTags:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      required:
      - code
      - message
      - data
      - requestId
      - timestamp
      properties:
        code:
          type: integer
        message: *id002
        data:
          type: object
        requestId: *id002
        timestamp: &id011
          type: string
          format: date-time
    PasswordLoginRequest:
      type: object
      required:
      - mobile
      - password
      properties:
        mobile:
          type: string
        password:
          type: string
    ManualMedicationCreateRequest:
      type: object
      required:
      - genericName
      - dose
      - frequency
      - administrationTime
      - startDate
      properties:
        captureTaskId: {type: string, description: Optional IMAGE/TEXT evidence task confirmed atomically with medication creation.}
        captureVersion: {type: integer, minimum: 1, maximum: 2147483647}
        genericName: &id003
          type: string
          minLength: 1
          maxLength: 128
        brandName: &id004
          type: string
        dose: &id005
          type: string
          minLength: 1
          maxLength: 64
        frequency: &id006
          type: string
          minLength: 1
          maxLength: 64
        administrationTime: &id007
          type: string
          minLength: 1
          maxLength: 128
        startDate: &id008
          type: string
          format: date
        endDate: &id009
          type: string
          format: date
          nullable: true
        status: &id010
          type: string
          enum:
          - ACTIVE
          - STOPPED
          - ARCHIVED
    MedicationUploadCreateRequest:
      type: object
      required:
      - fileAssetId
      properties:
        fileAssetId:
          type: integer
        sourceType:
          type: string
          enum:
          - DRUG_BOX
          - PRESCRIPTION
    MedicationUploadTask:
      type: object
      properties:
        taskId:
