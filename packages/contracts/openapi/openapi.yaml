        genericName: *id003
        brandName: *id004
        dose: *id005
        frequency: *id006
        administrationTime: *id007
        startDate: *id008
        endDate: *id009
        status: *id010
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
    MedicationConflictCheckRequest:
      type: object
      properties:
        medicationIds:
          type: array
          items:
            type: integer
    MedicationConflictResult:
